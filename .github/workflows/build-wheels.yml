name: Build & attach wheels (musllinux, Py 3.13)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-musl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4

      # Build wheels for musllinux (HA OS) using maturin
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: >
            --release
            --out dist
            --find-interpreter
            --compatibility musllinux_1_2
            -i python3.13
          sccache: true

      - name: List built files
        run: ls -lah dist

      # Upload to the GitHub Release we just published
      - name: Upload wheels to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
